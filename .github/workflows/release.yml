name: Release

# Builds Niftty.app, splits it into per-architecture archives (arm64 and
# x86_64, so downloads are half the size of a universal binary), signs them
# for Sparkle, generates per-arch appcast feeds, and publishes everything
# to a GitHub Release. The in-app updater reads the appcasts from
# releases/latest/download, which GitHub redirects to the newest release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (format: vX.Y.Z)"
        required: true

# Only one release at a time; concurrent releases would race on the
# GitHub Release assets and the "latest" pointer.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      ZIG_VERSION: "0.16.0"
      SPARKLE_VERSION: "2.9.6"
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be vX.Y.Z (e.g. v0.2.0), got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the build number (commit count) is correct.
          fetch-depth: 0

      - name: Check Sparkle signing key
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is not set."
            echo "Add the contents of your EdDSA private key as a repository"
            echo "secret named SPARKLE_PRIVATE_KEY (see docs/RELEASING.md)."
            exit 1
          fi

      - name: Install Zig
        run: |
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" \
            -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig"
          echo "$HOME/.zig/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build Niftty.app
        run: |
          # Export for this step's build and persist for later steps.
          export GHOSTTY_BUILD=$(git rev-list --count HEAD)
          export GHOSTTY_COMMIT=$(git rev-parse --short HEAD)
          echo "GHOSTTY_BUILD=$GHOSTTY_BUILD" >> "$GITHUB_ENV"
          echo "GHOSTTY_COMMIT=$GHOSTTY_COMMIT" >> "$GITHUB_ENV"
          # -Dversion-string skips the build graph's git tag detection,
          # which would otherwise panic because the tag must match the
          # version in build.zig.zon.
          zig build -Doptimize=ReleaseFast -Dversion-string="$GHOSTTY_VERSION"
        env:
          GHOSTTY_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify version injection
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ver=$(plutil -extract CFBundleShortVersionString raw \
            zig-out/Niftty.app/Contents/Info.plist)
          if [[ "$ver" != "$VERSION" ]]; then
            echo "::error::CFBundleShortVersionString is '$ver', expected '$VERSION'"
            exit 1
          fi
      - name: Check Apple signing secrets
        run: |
          missing=0
          for var in MAC_CERTIFICATE_P12 MAC_CERTIFICATE_PASSWORD \
                     MAC_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_KEY_ID \
                     APPLE_API_ISSUER_ID; do
            if [[ -z "${!var}" ]]; then
              echo "::error::$var secret is not set (see docs/RELEASING.md)."
              missing=1
            fi
          done
          exit $missing

      - name: Import Developer ID certificate
        run: |
          # Dedicated keychain so the signing identity is available to
          # codesign in later steps without polluting the login keychain.
          security create-keychain -p build build.keychain-db
          security default-keychain -s build.keychain-db
          security set-keychain-settings -t 3600 \
            -u -l /Users/runner/Library/Keychains/build.keychain-db
          printf '%s' "$MAC_CERTIFICATE_P12" | base64 -d > /tmp/signing.p12
          security import /tmp/signing.p12 -k build.keychain-db \
            -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k build build.keychain-db > /dev/null 2>&1 || true
          rm -f /tmp/signing.p12
          codesign --find-identity || true

      - name: Package per-architecture archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/package-macos-release.sh zig-out/Niftty.app dist "$VERSION"
          ls -lh dist/

      - name: Notarize, staple, and package DMGs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          brew install create-dmg
          # notarytool authenticates with an App Store Connect API key
          printf '%s' "$APPLE_API_KEY" | base64 -d > /tmp/apple-api.p8
          for arch in arm64 x86_64; do
            zip="dist/Niftty-v$VERSION-$arch.zip"

            xcrun notarytool submit "$zip" \
              --key /tmp/apple-api.p8 \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait

            # Staple the ticket to the app itself so Gatekeeper accepts it
            # even offline, then rebuild the zip around the stapled bundle.
            work=$(mktemp -d)
            ditto -x -k --sequesterRsrc "$zip" "$work"
            xcrun stapler staple "$work/Niftty.app"
            xcrun stapler validate "$work/Niftty.app"
            rm -f "$zip"
            ditto -c -k --sequesterRsrc --keepParent "$work/Niftty.app" "$zip"

            # Drag-and-drop installer DMG: app icon beside an
            # Applications drop-link in the volume window.
            dmg="dist/Niftty-v$VERSION-$arch.dmg"
            rm -f "$dmg"
            create-dmg \
              --volname "Niftty" \
              --window-size 660 400 \
              --icon-size 128 \
              --icon "Niftty.app" 180 158 \
              --app-drop-link 480 158 \
              --hide-extension "Niftty.app" \
              --no-internet-enable \
              "$dmg" "$work"
            xcrun notarytool submit "$dmg" \
              --key /tmp/apple-api.p8 \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            rm -rf "$work"
          done
          rm -f /tmp/apple-api.p8

      - name: Sign updates and generate appcasts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # sign_update comes from the same Sparkle version the app embeds.
          curl -fsSL -o /tmp/sparkle.zip \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip"
          mkdir -p /tmp/sparkle-bin
          unzip -q -j /tmp/sparkle.zip 'bin/sign_update' -d /tmp/sparkle-bin
          # Sanity-check the key before signing. After stripping whitespace it
          # must contain only base64 alphabet characters (an invisible BOM or
          # stray character makes Sparkle's strict decoder fail with an error
          # that historically got pasted straight into the appcast), and must
          # decode to exactly 32 bytes (Ed25519 seed, as exported by Sparkle's
          # `generate_keys -x`) or 96 bytes (legacy private+public format).
          key_clean=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '[:space:]')
          if [[ ! "$key_clean" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY contains characters outside the base64 alphabet (check for invisible characters or stray text). It must be the single base64 line exported by Sparkle's './generate_keys -x <file>'."
            exit 1
          fi
          key_bytes=$(printf '%s' "$key_clean" | base64 -d 2>/dev/null | wc -c | tr -d ' ')
          if [[ "$key_bytes" != 32 && "$key_bytes" != 96 ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY decodes to $key_bytes bytes; expected 32 (Ed25519 seed) or 96 (legacy format). Export the signing key with Sparkle's './generate_keys -x <file>' and put that file's single base64 line in the secret. If you regenerated the key pair, also update SUPublicEDKey in macos/Ghostty-Info.plist."
            exit 1
          fi
          printf '%s' "$key_clean" > /tmp/sparkle-eddsa.key

          base_url="https://github.com/404jul/niftty/releases/download/$TAG"
          pub_date=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

          for arch in arm64 x86_64; do
            zip="dist/Niftty-v$VERSION-$arch.zip"
            # sign_update prints errors on stdout too, so anchor the match and
            # require the full "signature + length" line; anything else fails.
            sig_output=$(/tmp/sparkle-bin/sign_update \
              --ed-key-file /tmp/sparkle-eddsa.key "$zip")
            read -r ed_sig length < <(
              printf '%s\n' "$sig_output" \
                | sed -nE 's/^sparkle:edSignature="([A-Za-z0-9+/=]+)" length="([0-9]+)"$/\1 \2/p'
            )
            if [[ -z "$ed_sig" || -z "$length" ]]; then
              echo "::error::Failed to sign $zip. sign_update output: $sig_output"
              exit 1
            fi

            cat > "dist/appcast-$arch.xml" <<EOF
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Niftty ($arch)</title>
              <link>https://github.com/404jul/niftty</link>
              <description>Most recent changes with links to updates for the $arch build.</description>
              <language>en</language>
              <item>
                <title>Niftty $VERSION</title>
                <pubDate>$pub_date</pubDate>
                <sparkle:version>$GHOSTTY_BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="$base_url/Niftty-v$VERSION-$arch.zip"
                  type="application/octet-stream"
                  sparkle:edSignature="$ed_sig"
                  length="$length"
                />
              </item>
            </channel>
          </rss>
          EOF
          done

          rm -f /tmp/sparkle-eddsa.key

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # On workflow_dispatch the tag may not exist yet; create it at
          # the dispatched commit. For tag pushes it already exists.
          extra=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            extra=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" \
            "${extra[@]}" \
            --title "Niftty $VERSION" \
            --notes "Automatic update notes are signed for Sparkle; the app checks for updates on its own via the \`appcast-*.xml\` feeds in this release.

          Downloads:
          - **Apple Silicon (M1/M2/M3/M4):** \`Niftty-v$VERSION-arm64.dmg\`
          - **Intel:** \`Niftty-v$VERSION-x86_64.dmg\`

          The DMG opens with the app beside an Applications folder shortcut — drag the app onto it to install. The \`.zip\` files are for the built-in Sparkle updater.

          The app is signed with a Developer ID certificate and notarized by Apple, so it opens on any Mac without Gatekeeper warnings." \
            dist/Niftty-v"$VERSION"-arm64.dmg \
            dist/Niftty-v"$VERSION"-x86_64.dmg \
            dist/appcast-arm64.xml \
            dist/appcast-x86_64.xml
