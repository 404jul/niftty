name: Debug Build

# TEMPORARY: reproduce the v0.4.0 release build failure with the raw
# xcodebuild command so compiler errors stream to the job log (zig's
# RunStep capture hides them). Delete after diagnosing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (the tag/commit that failed)"
        required: true
        default: "v0.4.0"

permissions:
  contents: read

jobs:
  debug:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ZIG_VERSION: "0.16.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --find swiftc
          xcrun swiftc --version

      - name: Install Zig
        run: |
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" \
            -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig"
          echo "$HOME/.zig/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build GhosttyKit.xcframework via zig
        # Expected to fail at the xcodebuild step; the xcframework and
        # resources are produced before that. Failure is fine.
        continue-on-error: true
        run: |
          export GHOSTTY_BUILD=$(git rev-list --count HEAD)
          export GHOSTTY_COMMIT=$(git rev-parse --short HEAD)
          zig build -Doptimize=ReleaseFast -Dversion-string=0.4.0

      - name: Raw xcodebuild (streams compiler errors)
        run: |
          cd macos
          xcodebuild \
            -target Ghostty \
            -configuration ReleaseLocal \
            GHOSTTY_COMMIT=$(git rev-parse --short HEAD) \
            MARKETING_VERSION=0.4.0 \
            CURRENT_PROJECT_VERSION=$(git rev-list --count HEAD) \
            2>&1 | tee /tmp/xcodebuild.log
          exit "${PIPESTATUS[0]}"
